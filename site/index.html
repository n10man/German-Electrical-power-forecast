<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Germany grid-load forecast map</title>
<meta name="description" content="Interactive map of Germany: hourly electricity-load forecasts for the four grid zones, for past days and as a snapshot of future days. Not production-grade.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161616" media="(prefers-color-scheme: dark)">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta property="og:type" content="website">
<meta property="og:locale" content="en_GB">
<meta property="og:title" content="Germany grid-load forecast map">
<meta property="og:description" content="Interactive map of Germany: hourly electricity-load forecasts for the four grid zones, for past days and as a snapshot of future days. Not production-grade.">
<meta property="og:image" content="preview.jpg">
<meta property="og:url" content="">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Germany grid-load forecast map">
<meta name="twitter:description" content="Interactive map of Germany: hourly electricity-load forecasts for the four grid zones, for past days and as a snapshot of future days. Not production-grade.">
<meta name="twitter:image" content="preview.jpg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="topbar">
    <h1 data-i18n="h1"></h1>
    <div class="topctl">
      <button type="button" id="licBtn" class="linkbtn" data-i18n="licences_button" aria-haspopup="dialog"></button>
      <div id="langs" class="langs" role="group" data-i18n-aria="lang_group"></div>
    </div>
  </div>
  <p class="sub" id="intro"></p>
  <div id="snapshot" class="snapshot" hidden>
    <p class="snaprow"><span id="snapShort"></span> <button type="button" id="snapToggle" class="snapbtn" aria-expanded="false" aria-controls="snapFull"></button></p>
    <p id="snapFull" class="snapfull" hidden></p>
  </div>
  <p id="ended" class="ended" role="status" hidden></p>
</header>
<main>
  <div class="layout">
    <section class="mapwrap" data-i18n-aria="map_section_aria">
      <svg id="map" role="group" data-i18n-aria="map_aria"></svg>
      <div class="mapfoot">
        <ul id="legend" class="legend"></ul>
        <p class="attrib"><a href="https://open-meteo.com/">Weather data by Open-Meteo.com</a> <span data-i18n="attrib_suffix"></span></p>
      </div>
      <div id="tip" class="tip" hidden></div>
    </section>
    <aside class="howto" id="howto">
      <h2 data-i18n="how_title"></h2>
      <ol>
        <li data-i18n="how_1"></li>
        <li data-i18n="how_2"></li>
        <li data-i18n="how_3"></li>
        <li data-i18n="how_4"></li>
        <li data-i18n="how_5"></li>
      </ol>
      <p class="note" data-i18n="how_zones"></p>
    </aside>
  </div>
  <p id="loaderr" class="err" hidden></p>
  <section class="disclaimer" aria-labelledby="disTitle">
    <h2 id="disTitle" data-i18n="disclaimer_title"></h2>
    <ul>
      <li data-i18n="disclaimer_1"></li>
      <li data-i18n="disclaimer_2"></li>
      <li data-i18n="disclaimer_3"></li>
      <li data-i18n="disclaimer_4"></li>
    </ul>
  </section>
</main>
<footer class="foot"><span id="privacyLine" data-i18n="privacy_line"></span> <a id="repoLink" href="https://github.com/n10man/German-Electrical-power-forecast" data-i18n="code_link"></a></footer>

<dialog id="popup" aria-labelledby="pTitle" tabindex="-1">
  <form method="dialog"><button class="close" data-i18n-aria="close"></button></form>
  <h2 id="pTitle"></h2>
  <p id="zoneStmt" class="stmt"></p>
  <p id="splitStmt" class="splitwarn" hidden></p>
  <div class="controls">
    <label><span data-i18n="label_date"></span> <input type="date" id="date"></label>
    <span class="jump"><button type="button" id="jumpLatest" data-i18n="jump_latest" data-i18n-title="tip_latest"></button><button type="button" id="jumpToday" data-i18n="jump_today" data-i18n-title="tip_today" hidden></button></span>
    <label><span data-i18n="label_hour"></span> <select id="hour"></select></label>
  </div>
  <p id="todayMsg" class="small todaymsg" role="status" hidden></p>
  <p id="badge" class="badge"></p>
  <p id="headline" class="headline"></p>
  <svg id="chart" role="img" data-i18n-aria="chart_aria"></svg>
  <ul class="chartkey">
    <li class="k-act-li"><i class="k-act"></i><span data-i18n="key_actual"></span></li><li><i class="k-fc"></i><span data-i18n="key_forecast"></span></li><li class="k-band-li"><i class="k-b80"></i><span data-i18n="key_80"></span></li><li class="k-band-li"><i class="k-b95"></i><span data-i18n="key_95"></span></li>
  </ul>
  <label class="switch"><input type="checkbox" id="bands"> <span data-i18n="show_range"></span></label>
  <p class="small rangehint" data-i18n="range_hint"></p>
  <details id="more" class="more">
    <summary data-i18n="more_details"></summary>
    <p id="periodNote" class="small"></p>
    <p id="dayInfo" class="small"></p>
    <table id="hourTable" class="hourtable" aria-live="polite"></table>
    <div id="fcNote" class="fcnote" hidden></div>
    <p id="covStmt" class="cov"></p>
    <p id="backtestNote" class="backtest" data-i18n="backtest_note"></p>
  </details>
</dialog>

<dialog id="licDialog" aria-labelledby="licTitle" class="licdlg" tabindex="-1">
  <form method="dialog"><button class="close" data-i18n-aria="licences_close"></button></form>
  <h2 id="licTitle" data-i18n="licences_title"></h2>
  <div id="licBody" class="licbody"></div>
</dialog>
<script src="config.js"></script>
<script src="today.js"></script>
<script src="app.js"></script>
</body>
</html>
